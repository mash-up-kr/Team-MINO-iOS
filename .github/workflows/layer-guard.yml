name: layer-guard

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  layer-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Domain 순수성은 규율이 아니라 구조로 보장한다 — 의존 자체가 없으면 오염 경로도 없다
      - name: Domain은 의존 패키지 0
        run: |
          if grep -q '\.package(' Packages/Domain/Package.swift; then
            echo "::error::Domain/Package.swift에 패키지 의존이 선언됐습니다 — Domain은 의존 0이어야 합니다 (.claude/docs/clean-architecture.md)"
            exit 1
          fi
